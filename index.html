<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Counter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="card">
      <h2>JS Counter</h2>
      <p class="display">0</p>
      <div class="buttons">
        <button class="decrease" style="background-color: blue">
          Decrease
        </button>
        <button class="reset" style="background: red">Reset</button>
        <button class="increase" style="background-color: green">
          Increase
        </button>
      </div>
    </div>
  </body>
</html>
